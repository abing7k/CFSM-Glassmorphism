name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate dist
        run: bun run validate:dist

      # dist/ 已提交进仓库，所以这里只校验「构建结果与已提交的产物一致」，
      # 避免源码改了却忘记重新编译、把过期产物推上去。
      # 本 fork 使用单分支 + dist/ 子目录结构，CI 不再创建 theme-dist / preview-main。
      - name: Check committed dist is up to date
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist/ 与源码构建结果一致"
            exit 0
          fi
          echo "::error::dist/ 与当前源码的构建结果不一致，请先在本地运行 bun run publish 并提交 dist/。"
          git status --short -- dist
          exit 1
